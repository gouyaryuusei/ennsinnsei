<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>EBT: 全身ポーズ認識＆ネガティブ速度チェッカー</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  
  <!-- MediaPipe Pose -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>

  <style>
    :root {
      --bg-base: #0a0e17;
      --bg-surface: #121826;
      --bg-card: rgba(26, 35, 54, 0.75);
      --border-color: rgba(255, 255, 255, 0.1);
      --accent-blue: #3b82f6;
      --accent-cyan: #06b6d4;
      --accent-green: #10b981;
      --accent-warn: #ef4444;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --container-max-w: 640px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-base);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px 16px 36px;
      transition: background 0.3s;
    }

    header {
      width: 100%;
      max-width: var(--container-max-w);
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      transition: max-width 0.3s ease;
    }

    .title-badge {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    h1 {
      font-size: 1.15rem;
      font-weight: 800;
      background: linear-gradient(135deg, #60a5fa 0%, #38bdf8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.02em;
    }

    .version-tag {
      font-size: 0.65rem;
      font-weight: 700;
      padding: 2px 6px;
      background: rgba(59, 130, 246, 0.2);
      border: 1px solid rgba(59, 130, 246, 0.4);
      border-radius: 999px;
      color: #93c5fd;
    }

    .app-layout {
      width: 100%;
      max-width: var(--container-max-w);
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: max-width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* ツールバー */
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      background: var(--bg-card);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 8px 12px;
    }

    .tool-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .tool-label {
      font-size: 0.72rem;
      color: var(--text-muted);
      font-weight: 600;
      margin-right: 2px;
    }

    .btn-tool {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: var(--text-main);
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.2s ease;
    }

    .btn-tool:hover {
      background: rgba(255, 255, 255, 0.15);
      border-color: rgba(255, 255, 255, 0.25);
    }

    .btn-tool.active {
      background: #2563eb;
      border-color: #3b82f6;
      color: white;
      box-shadow: 0 0 12px rgba(37, 99, 235, 0.5);
    }

    /* カメラビューコンテナ（横伸び防止・アスペクト比保持） */
    .camera-container {
      position: relative;
      width: 100%;
      background: #000;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.6), 0 0 0 1px var(--border-color);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 280px;
    }

    video {
      display: none;
    }

    /* 正確なアスペクト比を維持して表示 */
    canvas {
      width: 100%;
      height: auto;
      max-height: 80vh;
      display: block;
      object-fit: contain;
    }

    /* カメラ未起動時のプレースホルダ */
    .camera-placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
      padding: 24px;
      text-align: center;
      z-index: 5;
    }

    .camera-placeholder.hidden {
      display: none;
    }

    .placeholder-icon {
      font-size: 3rem;
      margin-bottom: 12px;
      opacity: 0.9;
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    .placeholder-title {
      font-size: 1.15rem;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .placeholder-desc {
      font-size: 0.82rem;
      color: var(--text-muted);
      max-width: 380px;
      line-height: 1.5;
      margin-bottom: 18px;
    }

    .btn-primary {
      padding: 12px 28px;
      font-size: 0.95rem;
      font-weight: 700;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.4);
      transition: all 0.2s ease;
    }

    .btn-primary:hover {
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      transform: translateY(-1px);
    }

    /* HUDオーバーレイ */
    .hud-overlay {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      display: flex;
      justify-content: space-between;
      pointer-events: none;
      z-index: 4;
    }

    .hud-chip {
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      padding: 5px 12px;
      font-size: 0.75rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .hud-chip.searching {
      color: #fbbf24;
      border-color: rgba(251, 191, 36, 0.3);
    }

    .hud-chip.locked {
      color: #34d399;
      border-color: rgba(52, 211, 153, 0.4);
    }

    .hud-chip.warn {
      color: #f87171;
      border-color: rgba(248, 113, 113, 0.5);
      background: rgba(185, 28, 28, 0.7);
    }

    .pulse-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: currentColor;
      box-shadow: 0 0 8px currentColor;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.8); }
    }

    /* フルスクリーン時用HUD */
    .fullscreen-stats {
      position: absolute;
      bottom: 14px;
      left: 14px;
      right: 14px;
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      padding: 10px 14px;
      display: none;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      text-align: center;
      z-index: 4;
    }

    .camera-container.is-fullscreen .fullscreen-stats {
      display: grid;
    }

    /* ダッシュボード */
    .dashboard {
      background: var(--bg-card);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 14px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .metric-card {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.06);
      padding: 10px 12px;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .metric-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .metric-label {
      font-size: 0.72rem;
      color: var(--text-muted);
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    .metric-value {
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.5rem;
      font-weight: 700;
      margin-top: 4px;
      letter-spacing: -0.03em;
    }

    .status-ok { color: var(--accent-green); }
    .status-warn { color: var(--accent-warn); text-shadow: 0 0 10px rgba(239, 68, 68, 0.4); }
    .status-concentric { color: var(--accent-blue); }

    /* 設定パネル */
    .settings-panel {
      background: var(--bg-card);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .settings-title {
      font-size: 0.82rem;
      font-weight: 700;
      color: #93c5fd;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .setting-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.8rem;
      gap: 12px;
    }

    input[type="range"] {
      flex: 1;
      accent-color: var(--accent-blue);
      cursor: pointer;
    }

    /* レスポンシブ */
    @media (max-width: 480px) {
      body { padding: 8px 10px 24px; }
      .dashboard { grid-template-columns: 1fr 1fr; }
      .metric-value { font-size: 1.3rem; }
    }
  </style>
</head>
<body>

  <header>
    <div class="title-badge">
      <h1>EBT Pose Velocity Tracker</h1>
      <span class="version-tag">AI 全身認識</span>
    </div>
    <div id="activeCameraBadge" style="font-size: 0.72rem; color: var(--text-muted);">
      カメラ: 未起動
    </div>
  </header>

  <div class="app-layout" id="appLayout">
    
    <!-- ツールバー：画面サイズ＆カメラ切り替え -->
    <div class="toolbar">
      <!-- 画面サイズ -->
      <div class="tool-group">
        <span class="tool-label">表示:</span>
        <button id="sizeStdBtn" class="btn-tool" title="標準 (520px)">標準</button>
        <button id="sizeLgBtn" class="btn-tool active" title="大画面 (850px)">大画面</button>
        <button id="sizeFullWidthBtn" class="btn-tool" title="幅いっぱい">最大</button>
        <button id="fullscreenBtn" class="btn-tool" title="全画面表示">⛶ 全画面</button>
      </div>

      <!-- カメラ設定 -->
      <div class="tool-group">
        <button id="switchCamBtn" class="btn-tool" title="フロント / 背面カメラ切り替え">
          <span id="camIcon">🔄</span> <span id="camText">インカメ切替</span>
        </button>
        <button id="mirrorToggleBtn" class="btn-tool active" title="左右反転（ミラー表示）">
          🪞 ミラー
        </button>
      </div>
    </div>

    <!-- カメラ＆描画キャンバス（横伸び防止） -->
    <div class="camera-container" id="cameraBox">
      <video id="webcam" playsinline autoplay muted></video>
      <canvas id="output"></canvas>

      <!-- HUD（認識状態） -->
      <div class="hud-overlay">
        <div id="hudMarkerStatus" class="hud-chip searching">
          <span class="pulse-dot"></span>
          <span id="hudStatusText">全身をカメラに映してください</span>
        </div>
        <div id="hudVelocityTag" class="hud-chip" style="font-family: 'JetBrains Mono', monospace;">
          0 px/s
        </div>
      </div>

      <!-- 全画面時のHUD -->
      <div class="fullscreen-stats">
        <div>
          <div class="metric-label">フェーズ</div>
          <div id="fsPhase" style="font-weight: 700; font-size: 0.95rem;">-</div>
        </div>
        <div>
          <div class="metric-label">速度</div>
          <div id="fsVelocity" style="font-family: 'JetBrains Mono'; font-weight: 700; font-size: 0.95rem;">0</div>
        </div>
        <div>
          <div class="metric-label">TUT</div>
          <div id="fsTut" style="font-family: 'JetBrains Mono'; font-weight: 700; font-size: 0.95rem;">0.0s</div>
        </div>
        <div>
          <div class="metric-label">レップ数</div>
          <div id="fsRep" style="font-family: 'JetBrains Mono'; font-weight: 700; font-size: 0.95rem; color: #60a5fa;">0</div>
        </div>
      </div>

      <!-- プレースホルダ -->
      <div class="camera-placeholder" id="placeholder">
        <div class="placeholder-icon">🧍</div>
        <div class="placeholder-title">AI 全身ポーズ＆速度トラッカー</div>
        <div class="placeholder-desc">
          AIが全身と関節を自動認識。体の中心に一直線マーカー、各関節に丸マーカーを表示し、ブレのない正確なネガティブ速度とレップ数を計測します。
        </div>
        <button id="startBtn" class="btn-primary">
          <span>📷</span> カメラ起動 / 計測開始
        </button>
      </div>
    </div>

    <!-- ダッシュボード -->
    <div class="dashboard">
      <div class="metric-card">
        <div class="metric-header">
          <span class="metric-label">現在のフェーズ</span>
          <span>⚡</span>
        </div>
        <div id="phaseDisplay" class="metric-value">-</div>
      </div>
      <div class="metric-card">
        <div class="metric-header">
          <span class="metric-label">降下速度</span>
          <span style="font-size: 0.7rem; color: var(--text-muted);">px/s</span>
        </div>
        <div id="velocityDisplay" class="metric-value">0</div>
      </div>
      <div class="metric-card">
        <div class="metric-header">
          <span class="metric-label">ネガティブ時間 (TUT)</span>
          <span>⏱️</span>
        </div>
        <div id="tutDisplay" class="metric-value">0.0s</div>
      </div>
      <div class="metric-card">
        <div class="metric-header">
          <span class="metric-label">総レップ数</span>
          <span>🏋️</span>
        </div>
        <div id="repDisplay" class="metric-value" style="color: #60a5fa;">0</div>
      </div>
    </div>

    <!-- 設定パネル -->
    <div class="settings-panel">
      <div class="settings-title">
        <span>⚙️</span> トラッキング設定 & 補正
      </div>

      <!-- スムージング（ブレ除去）強度 -->
      <div class="setting-row">
        <span>ブレ抑制（スムージング強度）:</span>
        <input type="range" id="smoothingRange" min="1" max="9" value="7">
        <span id="smoothingVal" style="font-family: 'JetBrains Mono'; font-size: 0.8rem; width: 28px;">7</span>
      </div>

      <!-- 追跡基準部位 -->
      <div class="setting-row">
        <span>追跡基準点:</span>
        <div style="display: flex; gap: 6px;">
          <button id="trackHipBtn" class="btn-tool active">腰 (スクワット/デッド)</button>
          <button id="trackShoulderBtn" class="btn-tool">肩 (懸垂/プレス)</button>
        </div>
      </div>

      <!-- 直線ガイドと関節マーカーの表示トグル -->
      <div class="setting-row">
        <span>体幹・一直線ガイド表示:</span>
        <button id="toggleGuideBtn" class="btn-tool active">ON</button>
      </div>

      <!-- リセット -->
      <div style="display: flex; justify-content: flex-end; margin-top: 4px;">
        <button id="resetRepBtn" class="btn-tool" style="color: #f87171;">レップ数リセット</button>
      </div>
    </div>

  </div>

  <script>
    // --- DOM要素 ---
    const appLayout = document.getElementById('appLayout');
    const cameraBox = document.getElementById('cameraBox');
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('output');
    const ctx = canvas.getContext('2d');
    const placeholder = document.getElementById('placeholder');
    const startBtn = document.getElementById('startBtn');
    const activeCameraBadge = document.getElementById('activeCameraBadge');

    // 画面サイズボタン
    const sizeStdBtn = document.getElementById('sizeStdBtn');
    const sizeLgBtn = document.getElementById('sizeLgBtn');
    const sizeFullWidthBtn = document.getElementById('sizeFullWidthBtn');
    const fullscreenBtn = document.getElementById('fullscreenBtn');

    // カメラボタン
    const switchCamBtn = document.getElementById('switchCamBtn');
    const mirrorToggleBtn = document.getElementById('mirrorToggleBtn');
    const camText = document.getElementById('camText');

    // メーター要素
    const phaseDisplay = document.getElementById('phaseDisplay');
    const velocityDisplay = document.getElementById('velocityDisplay');
    const tutDisplay = document.getElementById('tutDisplay');
    const repDisplay = document.getElementById('repDisplay');
    const fsPhase = document.getElementById('fsPhase');
    const fsVelocity = document.getElementById('fsVelocity');
    const fsTut = document.getElementById('fsTut');
    const fsRep = document.getElementById('fsRep');
    const hudMarkerStatus = document.getElementById('hudMarkerStatus');
    const hudStatusText = document.getElementById('hudStatusText');
    const hudVelocityTag = document.getElementById('hudVelocityTag');

    // 設定要素
    const smoothingRange = document.getElementById('smoothingRange');
    const smoothingVal = document.getElementById('smoothingVal');
    const trackHipBtn = document.getElementById('trackHipBtn');
    const trackShoulderBtn = document.getElementById('trackShoulderBtn');
    const toggleGuideBtn = document.getElementById('toggleGuideBtn');
    const resetRepBtn = document.getElementById('resetRepBtn');

    // --- カメラ＆動作状態 ---
    let currentFacingMode = 'user'; // インカメ初期値
    let isMirror = true;
    let isCameraRunning = false;
    let currentStream = null;
    let poseDetector = null;

    // --- トラッキング＆ブレ防止フィルタ ---
    let trackingTarget = 'hip'; // 'hip' または 'shoulder'
    let showCenterGuide = true;
    let smoothAlpha = 0.25; // EMA係数 (小さいほど強力に平滑化・ブレ除去)

    // スムージング用バッファ
    let smoothedTrackPoint = null;
    let smoothedLandmarks = null;
    let smoothedVelocity = 0;

    // --- 厳密なレップ数判定ステートマシン ---
    // 状態: 'TOP' (開始位置) -> 'ECCENTRIC' (下降中) -> 'BOTTOM' (最下点到達) -> 'CONCENTRIC' (挙上中) -> カウント完了
    let motionState = 'TOP';
    let topBaselineY = null;     // 直立時の最上点Y
    let bottomY = null;          // 最下点Y
    let minDisplacement = 35;    // レップと認定する最小ストローク幅 (px)
    let eccentricStartTime = 0;
    let repCount = 0;
    let lastRepTime = 0;         // デバウンス用
    let isWarning = false;

    // 速度閾値
    const VELOCITY_MOVE_THRESHOLD = 25; // px/s 運動開始判定
    const MAX_ALLOWED_ECC_VELOCITY = 240; // px/s 落下警告

    // Web Audio API
    let audioCtx = null;
    function playBeep(freq = 440, type = 'sine', duration = 0.1) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.value = freq;
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {
        console.warn(e);
      }
    }

    // --- MediaPipe Pose初期化 ---
    function initPose() {
      if (poseDetector) return;
      poseDetector = new Pose({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
      });

      poseDetector.setOptions({
        modelComplexity: 1,
        smoothLandmarks: true,
        enableSegmentation: false,
        minDetectionConfidence: 0.5,
        minTrackingConfidence: 0.5
      });

      poseDetector.onResults(onPoseResults);
    }

    // --- カメラ起動 ---
    async function startCamera() {
      if (currentStream) {
        currentStream.getTracks().forEach(track => track.stop());
      }

      initPose();

      const constraints = {
        video: {
          facingMode: currentFacingMode,
          width: { ideal: 1280 },
          height: { ideal: 720 }
        },
        audio: false
      };

      try {
        currentStream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = currentStream;
        await video.play();

        video.onloadedmetadata = () => {
          // カメラ映像のピクセルサイズにCanvasを一致させる
          canvas.width = video.videoWidth || 640;
          canvas.height = video.videoHeight || 480;
          // 横伸び防止: アスペクト比をコンテナにも反映
          cameraBox.style.aspectRatio = `${canvas.width} / ${canvas.height}`;
        };

        isCameraRunning = true;
        placeholder.classList.add('hidden');
        updateCameraUI();

        // フレーム処理ループ
        processVideoLoop();
      } catch (err) {
        console.error("Camera Error:", err);
        alert("カメラの起動に失敗しました: " + err.message);
      }
    }

    function updateCameraUI() {
      const isFront = (currentFacingMode === 'user');
      camText.innerText = isFront ? "背面カメラへ" : "インカメへ";
      activeCameraBadge.innerText = `カメラ: ${isFront ? "インカメラ" : "背面カメラ"}`;
      mirrorToggleBtn.classList.toggle('active', isMirror);
    }

    // カメラ切替
    switchCamBtn.addEventListener('click', async () => {
      currentFacingMode = (currentFacingMode === 'user') ? 'environment' : 'user';
      isMirror = (currentFacingMode === 'user');
      updateCameraUI();
      if (isCameraRunning) await startCamera();
    });

    // ミラー切替
    mirrorToggleBtn.addEventListener('click', () => {
      isMirror = !isMirror;
      mirrorToggleBtn.classList.toggle('active', isMirror);
    });

    // 開始ボタン
    startBtn.addEventListener('click', () => {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      startCamera();
    });

    // 画面サイズ切替
    function setAppSize(mode) {
      sizeStdBtn.classList.remove('active');
      sizeLgBtn.classList.remove('active');
      sizeFullWidthBtn.classList.remove('active');

      if (mode === 'std') {
        document.documentElement.style.setProperty('--container-max-w', '520px');
        sizeStdBtn.classList.add('active');
      } else if (mode === 'lg') {
        document.documentElement.style.setProperty('--container-max-w', '850px');
        sizeLgBtn.classList.add('active');
      } else if (mode === 'full') {
        document.documentElement.style.setProperty('--container-max-w', '100%');
        sizeFullWidthBtn.classList.add('active');
      }
    }

    sizeStdBtn.addEventListener('click', () => setAppSize('std'));
    sizeLgBtn.addEventListener('click', () => setAppSize('lg'));
    sizeFullWidthBtn.addEventListener('click', () => setAppSize('full'));

    // 全画面表示
    fullscreenBtn.addEventListener('click', () => {
      if (!document.fullscreenElement) {
        cameraBox.requestFullscreen().catch(e => alert("全画面エラー: " + e.message));
      } else {
        document.exitFullscreen();
      }
    });

    document.addEventListener('fullscreenchange', () => {
      if (document.fullscreenElement) {
        cameraBox.classList.add('is-fullscreen');
        fullscreenBtn.classList.add('active');
      } else {
        cameraBox.classList.remove('is-fullscreen');
        fullscreenBtn.classList.remove('active');
      }
    });

    // 設定操作
    smoothingRange.addEventListener('input', (e) => {
      const v = parseInt(e.target.value);
      smoothingVal.innerText = v;
      // 1 (低平滑化・反応優先) 〜 9 (強力平滑化・ブレ極小)
      smoothAlpha = 0.55 - (v * 0.045); // 0.10 〜 0.50
    });

    trackHipBtn.addEventListener('click', () => {
      trackingTarget = 'hip';
      trackHipBtn.classList.add('active');
      trackShoulderBtn.classList.remove('active');
      topBaselineY = null;
    });

    trackShoulderBtn.addEventListener('click', () => {
      trackingTarget = 'shoulder';
      trackShoulderBtn.classList.add('active');
      trackHipBtn.classList.remove('active');
      topBaselineY = null;
    });

    toggleGuideBtn.addEventListener('click', () => {
      showCenterGuide = !showCenterGuide;
      toggleGuideBtn.classList.toggle('active', showCenterGuide);
      toggleGuideBtn.innerText = showCenterGuide ? "ON" : "OFF";
    });

    resetRepBtn.addEventListener('click', () => {
      repCount = 0;
      repDisplay.innerText = 0;
      fsRep.innerText = 0;
      tutDisplay.innerText = "0.0s";
      fsTut.innerText = "0.0s";
      motionState = 'TOP';
      topBaselineY = null;
    });

    // --- メインループ: ビデオをMediaPipeに送信 ---
    async function processVideoLoop() {
      if (!isCameraRunning) return;
      if (video.readyState >= 2 && poseDetector) {
        await poseDetector.send({ image: video });
      }
      requestAnimationFrame(processVideoLoop);
    }

    // --- ポーズ推定結果の受信 & 描画 ---
    let lastFrameTimestamp = performance.now();

    function onPoseResults(results) {
      if (!isCameraRunning) return;
      const now = performance.now();
      const dt = (now - lastFrameTimestamp) / 1000;
      lastFrameTimestamp = now;

      // 1. 映像をCanvasに描画（横伸び防止・アスペクト比維持、ミラー対応）
      ctx.save();
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (isMirror) {
        ctx.translate(canvas.width, 0);
        ctx.scale(-1, 1);
      }
      ctx.drawImage(results.image, 0, 0, canvas.width, canvas.height);
      ctx.restore();

      if (!results.poseLandmarks) {
        // 全身未検出
        hudMarkerStatus.className = 'hud-chip searching';
        hudStatusText.innerText = '全身をカメラに映してください';
        hudVelocityTag.innerText = '0 px/s';
        drawGuidanceOverlay();
        return;
      }

      hudMarkerStatus.className = 'hud-chip locked';
      hudStatusText.innerText = '全身・関節ロック中';

      // 2. ランドマークの座標変換＆スムージング（ブレ除去）
      const rawLm = results.poseLandmarks;
      const landmarks = [];

      for (let i = 0; i < rawLm.length; i++) {
        let x = rawLm[i].x * canvas.width;
        let y = rawLm[i].y * canvas.height;
        if (isMirror) {
          x = canvas.width - x; // ミラー時は反転
        }

        // EMAスムージング
        if (!smoothedLandmarks || !smoothedLandmarks[i]) {
          landmarks[i] = { x, y, visibility: rawLm[i].visibility };
        } else {
          landmarks[i] = {
            x: smoothAlpha * x + (1 - smoothAlpha) * smoothedLandmarks[i].x,
            y: smoothAlpha * y + (1 - smoothAlpha) * smoothedLandmarks[i].y,
            visibility: rawLm[i].visibility
          };
        }
      }
      smoothedLandmarks = landmarks;

      // 3. 追跡基準点（腰中心 または 肩中心）の算出
      // 11: 左肩, 12: 右肩, 23: 左腰, 24: 右腰
      let targetX = 0, targetY = 0;
      if (trackingTarget === 'hip') {
        targetX = (landmarks[23].x + landmarks[24].x) / 2;
        targetY = (landmarks[23].y + landmarks[24].y) / 2;
      } else {
        targetX = (landmarks[11].x + landmarks[12].x) / 2;
        targetY = (landmarks[11].y + landmarks[12].y) / 2;
      }

      // 追跡点のEMAスムージング
      if (!smoothedTrackPoint) {
        smoothedTrackPoint = { x: targetX, y: targetY };
      } else {
        smoothedTrackPoint.x = smoothAlpha * targetX + (1 - smoothAlpha) * smoothedTrackPoint.x;
        smoothedTrackPoint.y = smoothAlpha * targetY + (1 - smoothAlpha) * smoothedTrackPoint.y;
      }

      // 4. 速度の計算＆平滑化
      let rawVelocity = 0;
      if (dt > 0.005) {
        const dy = targetY - (smoothedTrackPoint.y); // 下向きが正
        rawVelocity = (dy / dt) * 0.4;
      }
      smoothedVelocity = 0.25 * rawVelocity + 0.75 * smoothedVelocity;
      const absVelocity = Math.round(Math.abs(smoothedVelocity));

      // 5. 厳密なレップ数判定 & ネガティブ速度チェック
      updateMotionRepLogic(smoothedTrackPoint.y, smoothedVelocity, now);

      // 6. 体幹・一直線マーカー & 関節丸マーカーの描画
      drawBodyAlignmentAndJoints(landmarks, smoothedTrackPoint, absVelocity);
    }

    // --- 厳密なレップ数判定ロジック ---
    function updateMotionRepLogic(currentY, velocity, timestamp) {
      // 画面高さに対する最小可動域（約 6%）
      minDisplacement = Math.max(30, canvas.height * 0.06);

      // 初期基準位置の設定
      if (topBaselineY === null) {
        topBaselineY = currentY;
        bottomY = currentY;
      }

      // 最上点（トップ）の動的補正
      if (currentY < topBaselineY && Math.abs(velocity) < 15) {
        topBaselineY = 0.1 * currentY + 0.9 * topBaselineY;
      }

      const displacement = currentY - topBaselineY; // 下降変位量

      // ステートマシン判定
      switch (motionState) {
        case 'TOP':
          // トップ位置で静止または下降開始待ち
          phaseDisplay.innerText = '準備完了 (TOP)';
          phaseDisplay.className = 'metric-value';
          fsPhase.innerText = 'TOP (静止)';
          fsPhase.className = 'metric-value';
          isWarning = false;

          // 明確に下降（速度＆一定変位）でエキセントリック開始
          if (velocity > VELOCITY_MOVE_THRESHOLD && displacement > minDisplacement * 0.3) {
            motionState = 'ECCENTRIC';
            eccentricStartTime = timestamp;
            bottomY = currentY;
          }
          break;

        case 'ECCENTRIC':
          // 下降中（エキセントリック）
          const tut = ((timestamp - eccentricStartTime) / 1000).toFixed(1);
          tutDisplay.innerText = `${tut}s`;
          fsTut.innerText = `${tut}s`;

          if (currentY > bottomY) bottomY = currentY;

          // 落下警告チェック
          if (velocity > MAX_ALLOWED_ECC_VELOCITY) {
            isWarning = true;
            phaseDisplay.innerText = '⚠️ 落下（負荷抜け）';
            phaseDisplay.className = 'metric-value status-warn';
            fsPhase.innerText = '⚠️ 落下!';
            fsPhase.className = 'metric-value status-warn';
            hudMarkerStatus.className = 'hud-chip warn';
            playBeep(220, 'square', 0.05);
          } else {
            isWarning = false;
            phaseDisplay.innerText = 'エキセントリック ⬇️';
            phaseDisplay.className = 'metric-value status-ok';
            fsPhase.innerText = '下降 (ECC)';
            fsPhase.className = 'metric-value status-ok';
          }

          // 最下点で減速し、上昇に転じたか判定
          if (velocity < -VELOCITY_MOVE_THRESHOLD && (bottomY - topBaselineY) >= minDisplacement) {
            motionState = 'CONCENTRIC';
            isWarning = false;
          }
          break;

        case 'CONCENTRIC':
          // 上昇中（コンセントリック）
          phaseDisplay.innerText = '挙上中 ⬆️';
          phaseDisplay.className = 'metric-value status-concentric';
          fsPhase.innerText = '挙上 (CON)';
          fsPhase.className = 'metric-value status-concentric';
          isWarning = false;

          // 開始トップ位置の近くまで復帰したか？ (変位が最小ストロークの25%以下)
          if (displacement < minDisplacement * 0.25) {
            // デバウンス（前回のレップから最低0.7秒以上経過）
            if (timestamp - lastRepTime > 700) {
              repCount++;
              repDisplay.innerText = repCount;
              fsRep.innerText = repCount;
              lastRepTime = timestamp;
              playBeep(880, 'sine', 0.15); // チャイム音
            }
            motionState = 'TOP';
            topBaselineY = currentY;
          }
          break;
      }

      const absV = Math.round(Math.abs(velocity));
      velocityDisplay.innerText = absV;
      fsVelocity.innerText = absV;
      hudVelocityTag.innerText = `${absV} px/s`;
    }

    // --- 体一直線マーカー ＆ 関節丸マーカーの描画 ---
    function drawBodyAlignmentAndJoints(lm, targetPt, velocity) {
      ctx.save();

      // 主要関節インデックス
      // 0: 鼻, 11: 左肩, 12: 右肩, 13: 左肘, 14: 右肘, 15: 左手首, 16: 右手首
      // 23: 左腰, 24: 右腰, 25: 左膝, 26: 右膝, 27: 左足首, 28: 右足首
      const head = lm[0];
      const midShoulder = { x: (lm[11].x + lm[12].x) / 2, y: (lm[11].y + lm[12].y) / 2 };
      const midHip = { x: (lm[23].x + lm[24].x) / 2, y: (lm[23].y + lm[24].y) / 2 };
      const midAnkle = { x: (lm[27].x + lm[28].x) / 2, y: (lm[27].y + lm[28].y) / 2 };

      // 1. 体幹の一直線マーカー（レーザー垂直アライメント軸）
      if (showCenterGuide) {
        // 体の中心軸（頭〜肩中心〜腰中心〜足元）
        ctx.beginPath();
        // まっすぐ上下に貫くレーザーライン
        ctx.moveTo(midShoulder.x, Math.max(0, head.y - 40));
        ctx.lineTo(midShoulder.x, Math.min(canvas.height, midAnkle.y + 40));
        ctx.lineWidth = 3;
        ctx.strokeStyle = isWarning ? 'rgba(239, 68, 68, 0.85)' : 'rgba(6, 182, 212, 0.85)'; // シアンまたはレッド
        ctx.shadowColor = isWarning ? '#ef4444' : '#06b6d4';
        ctx.shadowBlur = 10;
        ctx.stroke();

        // センターラインの目盛・水平クロスガイド（肩と腰の傾き水平線）
        ctx.lineWidth = 2;
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.6)';
        // 肩ライン
        ctx.beginPath();
        ctx.moveTo(lm[11].x, lm[11].y);
        ctx.lineTo(lm[12].x, lm[12].y);
        ctx.stroke();
        // 腰ライン
        ctx.beginPath();
        ctx.moveTo(lm[23].x, lm[23].y);
        ctx.lineTo(lm[24].x, lm[24].y);
        ctx.stroke();
      }

      // 2. 骨格ボーンライン（腕・胴体・脚）
      const bones = [
        [11, 13], [13, 15], // 左腕
        [12, 14], [14, 16], // 右腕
        [11, 23], [12, 24], // 胴体サイド
        [23, 25], [25, 27], // 左脚
        [24, 26], [26, 28]  // 右脚
      ];

      ctx.lineWidth = 3.5;
      ctx.strokeStyle = 'rgba(16, 185, 129, 0.75)'; // ネオングリーン
      ctx.shadowColor = '#10b981';
      ctx.shadowBlur = 8;
      ctx.beginPath();
      for (const [s, e] of bones) {
        if (lm[s] && lm[e] && lm[s].visibility > 0.3 && lm[e].visibility > 0.3) {
          ctx.moveTo(lm[s].x, lm[s].y);
          ctx.lineTo(lm[e].x, lm[e].y);
        }
      }
      ctx.stroke();

      // 3. 各関節の「丸いマーカー」
      const jointIndices = [11, 12, 13, 14, 15, 16, 23, 24, 25, 26, 27, 28];
      for (const idx of jointIndices) {
        const p = lm[idx];
        if (!p || p.visibility < 0.3) continue;

        // 外側の丸マーカー
        ctx.beginPath();
        ctx.arc(p.x, p.y, 8, 0, 2 * Math.PI);
        ctx.fillStyle = '#ffffff';
        ctx.shadowColor = '#06b6d4';
        ctx.shadowBlur = 12;
        ctx.fill();

        // 内側コア
        ctx.beginPath();
        ctx.arc(p.x, p.y, 4, 0, 2 * Math.PI);
        ctx.fillStyle = isWarning ? '#ef4444' : '#0284c7';
        ctx.fill();
      }

      // 4. 現在の追跡基準点（腰 or 肩）にフォーカスターゲットHUD
      const fx = targetPt.x;
      const fy = targetPt.y;
      const focusColor = isWarning ? '#ef4444' : '#3b82f6';

      ctx.beginPath();
      ctx.arc(fx, fy, 16, 0, 2 * Math.PI);
      ctx.lineWidth = 3;
      ctx.strokeStyle = focusColor;
      ctx.shadowColor = focusColor;
      ctx.shadowBlur = 14;
      ctx.stroke();

      // 追跡情報タグ
      const tagText = isWarning ? `⚠️ 落下! ${velocity} px/s` : `TRACK ${velocity} px/s`;
      ctx.font = 'bold 12px "JetBrains Mono", sans-serif';
      const tw = ctx.measureText(tagText).width;

      ctx.fillStyle = 'rgba(10, 14, 23, 0.85)';
      ctx.strokeStyle = focusColor;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.roundRect(fx + 22, fy - 12, tw + 14, 24, 6);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = isWarning ? '#fca5a5' : '#93c5fd';
      ctx.shadowBlur = 0;
      ctx.fillText(tagText, fx + 28, fy + 4);

      ctx.restore();
    }

    // 未検出時のガイダンス
    function drawGuidanceOverlay() {
      ctx.save();
      ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
      ctx.fillRect(0, 0, canvas.width, 36);
      ctx.font = '600 14px "Inter", sans-serif';
      ctx.fillStyle = '#fbbf24';
      ctx.textAlign = 'center';
      ctx.fillText('🧍 頭から足元までが映るようカメラの位置を調整してください', canvas.width / 2, 23);
      ctx.restore();
    }
  </script>
</body>
